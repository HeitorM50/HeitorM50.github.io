<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heitor M. — Portfólio</title>
<meta name="description" content="Portfólio pessoal de Heitor M. — desenvolvedor de software.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d10;
    --bg-soft:#12161b;
    --fg:#e6eaef;
    --muted:#8b96a5;
    --accent:#4ade80;
    --line:rgba(255,255,255,.08);
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(74,222,128,.10), transparent 60%),
      radial-gradient(700px 500px at 90% 110%, rgba(96,165,250,.08), transparent 60%);
    pointer-events:none;
    z-index:0;
  }
  main{
    position:relative;
    z-index:1;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(2rem,6vw,5rem) 1.5rem;
  }
  .wrap{width:100%;max-width:680px}
  .tag{
    display:inline-flex;
    align-items:center;
    gap:.5rem;
    font-family:var(--mono);
    font-size:.78rem;
    letter-spacing:.04em;
    color:var(--muted);
    border:1px solid var(--line);
    background:var(--bg-soft);
    border-radius:999px;
    padding:.35rem .8rem;
    margin-bottom:1.8rem;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 0 rgba(74,222,128,.6);
    animation:pulse 2.4s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(74,222,128,.5)}
    70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}
    100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}
  }
  h1{
    font-size:clamp(2.4rem,7vw,4rem);
    line-height:1.05;
    letter-spacing:-.03em;
    margin:0 0 1rem;
    font-weight:700;
  }
  h1 span{color:var(--accent)}
  .lead{
    font-size:clamp(1rem,2.4vw,1.15rem);
    line-height:1.65;
    color:var(--muted);
    max-width:52ch;
    margin:0 0 2.4rem;
  }
  .links{display:flex;flex-wrap:wrap;gap:.7rem}
  a.btn{
    font-family:var(--mono);
    font-size:.85rem;
    text-decoration:none;
    color:var(--fg);
    border:1px solid var(--line);
    background:var(--bg-soft);
    border-radius:10px;
    padding:.7rem 1.1rem;
    transition:border-color .18s ease, transform .18s ease, color .18s ease;
  }
  a.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
  a.btn.primary{border-color:rgba(74,222,128,.35)}
  footer{
    position:relative;
    z-index:1;
    border-top:1px solid var(--line);
    padding:1.2rem 1.5rem;
    font-family:var(--mono);
    font-size:.75rem;
    color:var(--muted);
    text-align:center;
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<main>
  <div class="wrap">
    <div class="tag"><span class="dot"></span>em construção</div>
    <h1>Heitor M.<br><span>desenvolvedor de software</span></h1>
    <p class="lead">
      Este é o começo do meu portfólio. Em breve: projetos, escrita técnica
      e as coisas que ando construindo. Por enquanto, os links abaixo.
    </p>
    <div class="links">
      <a class="btn primary" href="https://github.com/HeitorM50">GitHub</a>
      <a class="btn" href="mailto:heitorm50@gmail.com">Email</a>
    </div>
  </div>
</main>
<footer>© <span id="y">2026</span> Heitor M. — construído com HTML e café.</footer>
<script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
